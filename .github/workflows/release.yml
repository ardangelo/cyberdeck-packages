name: Package release

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: Positive, unpadded decimal release number
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require main and a positive release number
        env:
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$RELEASE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Release must be dispatched on main with a positive unpadded decimal number' >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.package }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [status-ready, cyberdeck-service, sharp-drm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build from locked public sources
        env:
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: python3 scripts/build-packages.py --package "${{ matrix.package }}" --release-number "$RELEASE_NUMBER" --output output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-${{ matrix.package }}
          path: output/${{ matrix.package }}/
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify packages and smoke
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verification and QEMU host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap qemu-user-static openjdk-21-jdk-headless g++-riscv64-linux-gnu kmod systemd gnupg dpkg-dev debian-archive-keyring
      - name: Run isolated behavioral tests
        run: python3 -m unittest discover -s tests -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-status-ready
          path: incoming/status-ready
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-cyberdeck-service
          path: incoming/cyberdeck-service
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-sharp-drm
          path: incoming/sharp-drm
      - name: Verify same-run sources, binaries, and ABI
        env:
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: python3 scripts/verify-artifacts.py --artifacts incoming --output verified --release-number "$RELEASE_NUMBER"
      - name: Exercise real target package transactions
        run: sudo python3 scripts/smoke-packages.py --input verified --output smoke-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-packages
          path: verified/
          if-no-files-found: error
          retention-days: 1

  archive:
    name: Archive immutable release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: apt-publish
    permissions:
      contents: write
    concurrency:
      group: cyberdeck-package-archive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install signed-archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-packages
          path: verified
      - name: Archive verified bytes and verify public Release assets
        env:
          RELEASE_NUMBER: ${{ inputs.release_number }}
          GH_TOKEN: ${{ github.token }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_GPG_SIGNING_FINGERPRINT: ${{ vars.APT_GPG_SIGNING_FINGERPRINT }}
        run: python3 scripts/archive-release.py --artifacts verified --release-number "$RELEASE_NUMBER" --repository-config repository.json --public-key keys/cyberdeck-archive.asc

  publish:
    name: Publish authenticated APT
    needs: archive
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
