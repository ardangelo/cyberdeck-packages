name: Recover release

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: Original positive, unpadded decimal release number
        required: true
        type: string
      source_run_id:
        description: Original Package release workflow run ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate recovery request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require main and positive decimal inputs
        env:
          RELEASE_NUMBER: ${{ inputs.release_number }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$RELEASE_NUMBER" =~ ^[1-9][0-9]*$ || ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Recovery requires main, an unpadded positive release number, and a positive original run ID' >&2
            exit 1
          fi

  prepare:
    name: Verify recovered package transport and target installation
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install verification and QEMU host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap qemu-user-static openjdk-21-jdk-headless g++-riscv64-linux-gnu kmod systemd gnupg dpkg-dev debian-archive-keyring python3-yaml
      - name: Register RISC-V binfmt for target chroot execution
        run: |
          if [ ! -e /proc/sys/fs/binfmt_misc/register ]; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          fi
          sudo /usr/lib/systemd/systemd-binfmt /usr/lib/binfmt.d/qemu-riscv64.conf
      - name: Retrieve and verify original build transport
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python3 scripts/recover-release.py --run-id "$SOURCE_RUN_ID" --release-number "$RELEASE_NUMBER" --output recovered
      - name: Exercise real target package transactions without credentials
        run: sudo env GITHUB_ACTIONS=true python3 scripts/smoke-packages.py --input recovered/verified --output smoke-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-recovery
          path: recovered/source-artifact.zip
          if-no-files-found: error
          retention-days: 1

  archive:
    name: Archive recovered immutable release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: apt-publish
    permissions:
      contents: read
      actions: read
    concurrency:
      group: cyberdeck-package-archive
      cancel-in-progress: false
    steps:
      - name: Require workflow-authorized publication token
        env:
          GH_TOKEN: ${{ secrets.APT_RELEASE_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'Set apt-publish secret APT_RELEASE_TOKEN with repository Contents: write, Workflows: write, and Actions: read; GITHUB_TOKEN cannot publish an older target with changed workflow files.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install signed-archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg python3-yaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-recovery
          path: retained
      - name: Archive original verified bytes and verify public Release assets
        env:
          RELEASE_NUMBER: ${{ inputs.release_number }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ secrets.APT_RELEASE_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_GPG_SIGNING_FINGERPRINT: ${{ vars.APT_GPG_SIGNING_FINGERPRINT }}
        run: python3 scripts/archive-release.py --source-artifact retained/source-artifact.zip --source-run-id "$SOURCE_RUN_ID" --release-number "$RELEASE_NUMBER" --repository-config repository.json --public-key keys/cyberdeck-archive.asc

  publish:
    name: Publish authenticated APT
    needs: archive
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
