name: Diagnose target runtime

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    name: Diagnose signed target bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the verification bootstrap tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap qemu-user-static gnupg dpkg-dev debian-archive-keyring
      - name: Exercise the same configured target base without package builds
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          import runpy
          import sys
          import tempfile
          sys.path.insert(0, str(Path('scripts').resolve()))
          helpers = runpy.run_path('scripts/smoke-packages.py')
          snapshot = json.loads(Path('source-lock.json').read_text())['debian_snapshot']
          try:
              with tempfile.TemporaryDirectory(prefix='cyberdeck-runtime-probe-') as temporary:
                  with helpers['prepared_rootfs'](Path(temporary) / 'rootfs', snapshot) as root:
                      result = helpers['target'](root, '/usr/bin/dpkg', '--audit')
                      assert not result.stdout.strip(), result.stdout
              print('CONFIGURED_TARGET_BASE_OK')
          except Exception as error:
              message = str(error).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + message, flush=True)
              raise
          PY
